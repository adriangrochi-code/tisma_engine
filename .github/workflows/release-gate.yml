name: Release gate (phones)

# The release gate's G16 (docs/spec/RELEASE_GATE.md, owner's decision 16-11-2026): the Android app on an emulator
# and the iPhone app on the simulator (apps/ios/TismaUITests/ReleaseGateTests.swift, tools/gate_ios_check.py),
# driven through its screens: the first-use assistant, opening an STL, an OBJ, a 3MF of its own and one from another
# program (G1), slicing the 20 mm cube and the 3DBenchy (G2), exporting the G-code and sending it to a simulated
# printer of each kind (G10), each result checked (apps/android/app/src/androidTest/.../ReleaseGateTest.kt). The store
# builds (stores.yml) depend on it; it also runs when the app or this file changes. Never skipped or relaxed (rule 3).
on:
  push:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "tools/gate_ios_check.py"
      - ".github/workflows/release-gate.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  android:
    name: Release gate G16 (Android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the NDK, the emulator and its system image
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" emulator platform-tools \
            "system-images;android-34;google_apis;x86_64" > /dev/null
      - name: Build the app (engine inside) and its gate test
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: The printer simulators (Moonraker, OctoPrint, PrusaLink, Duet on 7125–7128; Bambu Lab on 7129–7133)
        run: |
          nohup ./gradlew --no-daemon :mockprinters:run -Pport=7125 > "$RUNNER_TEMP/mockprinters.log" 2>&1 &
          timeout 300 sh -c 'until curl -sf http://127.0.0.1:7129/_tisma/received > /dev/null; do sleep 3; done'
      - name: The 3DBenchy (CC0, bench of dev)
        working-directory: .
        run: |
          git fetch -q --depth 1 origin dev
          git show FETCH_HEAD:bench/3DBenchy.stl.xz | xz -d > "$RUNNER_TEMP/3DBenchy.stl"
      - name: Start the emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n gate -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_5 -p "$ANDROID_AVD_HOME/gate.avd"
          "$ANDROID_HOME/emulator/emulator" -avd gate -no-window -no-audio -no-boot-anim -no-snapshot \
            -memory 4096 -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb wait-for-device
          timeout 600 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global $s 0; done
      - name: G16 on the emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear net.tismaservidores.tisma
          # The Printer screen asks for notifications (print progress); the system's dialog would pause the app, so
          # it is granted beforehand, as a person tapping «Allow».
          adb shell pm grant net.tismaservidores.tisma android.permission.POST_NOTIFICATIONS
          # Bambu Lab's simulator listens on the host's loopback: MQTT, FTPS and the FTPS data port.
          for p in 7130 7131 7133; do adb reverse tcp:$p tcp:$p; done
          adb push "$RUNNER_TEMP/3DBenchy.stl" /data/local/tmp/3DBenchy.stl
          adb shell chmod 644 /data/local/tmp/3DBenchy.stl
          adb shell am instrument -w -e class net.tisma.app.ReleaseGateTest -e benchy /data/local/tmp/3DBenchy.stl \
            net.tismaservidores.tisma.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/gate.txt"
          grep -q "^OK (1 test)" "$RUNNER_TEMP/gate.txt" || { echo "::error::Release gate G16 failed"; exit 1; }
          echo "Release gate G16 (Android): passed" >> "$GITHUB_STEP_SUMMARY"
      - name: What the screen showed, the app's log and the simulators' (on failure)
        if: failure()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb exec-out screencap -p > "$RUNNER_TEMP/gate-screen.png" || true
          adb logcat -d -t 400 > "$RUNNER_TEMP/gate-logcat.txt" || true
          # The app's own lines (its notices and its log, tag «Tisma»), the whole run.
          adb logcat -d | grep -iE " Tisma|tisma\.app|tismaservidores" > "$RUNNER_TEMP/gate-app.txt" || true
          tail -60 "$RUNNER_TEMP/gate-app.txt" || true
          tail -40 "$RUNNER_TEMP/gate-logcat.txt" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-gate-android
          path: |
            ${{ runner.temp }}/gate-screen.png
            ${{ runner.temp }}/gate-logcat.txt
            ${{ runner.temp }}/gate-app.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/mockprinters.log

  ios:
    name: Release gate G16 (iPhone simulator)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The shared module for the simulator
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64
      - name: The printer simulators (Moonraker, OctoPrint, PrusaLink, Duet on 7125–7128; Bambu Lab on 7129–7133)
        run: |
          nohup ./gradlew --no-daemon :mockprinters:run -Pport=7125 > "$RUNNER_TEMP/mockprinters.log" 2>&1 &
          # macOS has no timeout(1): up to 300 s.
          for i in $(seq 100); do curl -sf http://127.0.0.1:7129/_tisma/received > /dev/null && exit 0; sleep 3; done
          tail -30 "$RUNNER_TEMP/mockprinters.log"; exit 1
      - name: The gate's models (the 20 mm cube, tests/data/formats and the 3DBenchy of dev)
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          cp tests/data/formats/box.obj tests/data/formats/box.3mf tests/data/formats/pi2_prusaslicer.3mf "$RUNNER_TEMP/gate/"
          git fetch -q --depth 1 origin dev
          git show FETCH_HEAD:bench/3DBenchy.stl.xz | xz -d > "$RUNNER_TEMP/gate/3DBenchy.stl"
          python3 - "$RUNNER_TEMP/gate/cube20.stl" <<'PY'
          import sys
          v = [(x, y, z) for z in (0, 20) for y in (0, 20) for x in (0, 20)]
          faces = [(0, 2, 3), (0, 3, 1), (4, 5, 7), (4, 7, 6), (0, 1, 5), (0, 5, 4),
                   (2, 6, 7), (2, 7, 3), (0, 4, 6), (0, 6, 2), (1, 3, 7), (1, 7, 5)]
          with open(sys.argv[1], "w") as f:
              f.write("solid cube20\n")
              for t in faces:
                  f.write(" facet normal 0 0 0\n  outer loop\n")
                  for i in t:
                      f.write("   vertex %g %g %g\n" % v[i])
                  f.write("  endloop\n endfacet\n")
              f.write("endsolid cube20\n")
          PY
          ls -l "$RUNNER_TEMP/gate"
      - name: Get the engine as an iOS library (the CI's xcframework of dev)
        working-directory: apps/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tisma-engine-ios-xcframework&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "dev")] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/engine.zip"
            mkdir -p Engine/TismaEngine.xcframework && unzip -q "$RUNNER_TEMP/engine.zip" -d Engine/TismaEngine.xcframework
          fi
          test -d Engine/TismaEngine.xcframework || { echo "::error::No TismaEngine.xcframework from dev"; exit 1; }
      - name: Get XcodeGen (THIRD_PARTY.md, build tools)
        working-directory: apps/ios
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: G16 on the simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; p=[x for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]; print(p[-1]["udid"])')
          echo "device=$device" >> "$GITHUB_ENV"
          set +e
          TEST_RUNNER_GATE_DIR="$RUNNER_TEMP/gate" xcodebuild test -project Tisma.xcodeproj -scheme Tisma -destination "id=$device" \
            -only-testing:TismaUITests/ReleaseGateTests -resultBundlePath "$RUNNER_TEMP/gate.xcresult" > "$RUNNER_TEMP/gate-xcodebuild.log" 2>&1
          code=$?
          grep -E ': error: |error: -\[|Test Case .* (passed|failed)|Executed .* test' "$RUNNER_TEMP/gate-xcodebuild.log" | head -40
          tail -30 "$RUNNER_TEMP/gate-xcodebuild.log"
          [ $code -eq 0 ] && grep -q "Executed 1 test, with 0 failures" "$RUNNER_TEMP/gate-xcodebuild.log" \
            || { echo "::error::Release gate G16 (iPhone) failed"; exit 1; }
      - name: The G-code's size and each printer's copy (G2, G10)
        working-directory: .
        run: |
          container=$(xcrun simctl get_app_container "$device" net.tismaservidores.tisma data)
          python3 -I tools/gate_ios_check.py "$container" "$RUNNER_TEMP/gate/3DBenchy.stl" 7125 7126 7127 7128
          echo "Release gate G16 (iPhone): passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-gate-ios
          path: |
            ${{ runner.temp }}/gate-xcodebuild.log
            ${{ runner.temp }}/gate.xcresult
            ${{ runner.temp }}/mockprinters.log
