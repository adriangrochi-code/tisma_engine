name: Android

# The Android app (apps/android/, Gradle): its tests and a debug APK. It is
# kept apart from the engine's CMake build so the desktop CI is not slowed:
# it runs only when the app (or this file) changes, or when started by hand.
on:
  push:
    paths:
      - "apps/android/**"
      - "assets/brand/icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Android app (tests and debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the brand icons are up to date
        run: python3 tools/brand_icons.py --check
      - name: Test and build
        run: ./gradlew --no-daemon :cloud:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/cloud/build/reports/tests
            apps/android/app/build/reports/tests
