name: Android

# The Android app (apps/android/, Gradle): its tests and a debug APK with the
# engine inside (tisma-engine built with the NDK for arm64-v8a and x86_64)
# and, when the workflow «SolidCraft for Android» has a successful run whose
# artifacts are still kept, its solidcraft-cli for the Design tab.
# It is kept apart from the desktop CI: it runs only when the app, the
# engine's sources or this file change, or when started by hand.
on:
  push:
    paths:
      - "apps/android/**"
      - "src/**"
      - "CMakeLists.txt"
      - "assets/brand/icons/**"
      - "assets/icons/section_*.svg"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Android app (tests and debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the NDK the engine is built with
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
      - name: Check the brand icons are up to date
        run: python3 tools/brand_icons.py --check
      - name: Get SolidCraft from its own workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow solidcraft-android.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)
          dir="$RUNNER_TEMP/solidcraft"
          if [ -n "$run" ]; then
            for abi in arm64-v8a x86_64; do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "solidcraft-android-$abi" -D "$RUNNER_TEMP/sc-$abi" || true
              mkdir -p "$dir" && cp -rn "$RUNNER_TEMP/sc-$abi"/. "$dir"/ 2>/dev/null || true
            done
          fi
          if [ -f "$dir/arm64-v8a/solidcraft-cli" ] && [ -f "$dir/x86_64/solidcraft-cli" ]; then
            chmod +x "$dir"/*/solidcraft-cli
            echo "SolidCraft from run $run"; echo "SOLIDCRAFT=-Ptisma.solidcraft=$dir" >> "$GITHUB_ENV"
          else
            echo "::notice::No SolidCraft artifacts: the APK is built without the Design tab's CAD"
          fi
      - name: Test and build
        run: ./gradlew --no-daemon $SOLIDCRAFT :cloud:test :printers:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/cloud/build/reports/tests
            apps/android/app/build/reports/tests
