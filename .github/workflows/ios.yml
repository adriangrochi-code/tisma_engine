name: iOS

# The iPhone app's shared logic (apps/android/shared, Kotlin Multiplatform; apps/ios/PLAN.md): its common tests run
# on the iPhone simulator, where only a Mac can run them; then the SwiftUI app (apps/ios) is built and its tests run.
on:
  push:
    paths:
      - "apps/android/shared/**"
      - "apps/android/gradle/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared logic on the iPhone simulator
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tests of the shared module on the simulator (and on the JVM)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 :shared:jvmTest
      - name: Get the engine as an iOS library (the CI's xcframework of dev)
        working-directory: apps/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest dev artifact that has not expired, even from a run still going (its iOS job ends early).
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tisma-engine-ios-xcframework&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "dev")] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/engine.zip"
            mkdir -p Engine/TismaEngine.xcframework && unzip -q "$RUNNER_TEMP/engine.zip" -d Engine/TismaEngine.xcframework
            echo "Engine from artifact $id"
          fi
          test -d Engine/TismaEngine.xcframework || { echo "::error::No TismaEngine.xcframework from dev"; exit 1; }
          find Engine/TismaEngine.xcframework -maxdepth 3 | head -20
      - name: Get XcodeGen (THIRD_PARTY.md, build tools)
        working-directory: apps/ios
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the SwiftUI app and run its tests on the simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; p=[x for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]; m=[x for x in p if "Pro Max" in x["name"]]; print((m or p)[-1]["udid"])')
          # The App Store's screenshots are 6.9" (1320 x 2868): a Pro Max when the runner has one.
          echo "Simulator $device"
          set +e
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/screens" xcodebuild test -project Tisma.xcodeproj -scheme Tisma -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/Tisma.xcresult" > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          code=$?
          # The compiler's errors first, then the end (the tests).
          grep -E ': error: |Test Case .* failed|ENGINE-SLICE|ENGINE-ANALYZE|ENGINE-CAL|ENGINE-PACK' "$RUNNER_TEMP/xcodebuild.log" | head -40
          tail -40 "$RUNNER_TEMP/xcodebuild.log"
          exit $code
      # The app's size for the App Store (QA, 13-11-2026): a Release build for devices, unsigned, and what weighs
      # most in it. The download is about the zipped size; the App Store thins it further per device.
      - name: The app's size (Release, device)
        continue-on-error: true
        working-directory: .
        run: |
          (cd apps/android && ./gradlew --no-daemon -q :shared:linkReleaseFrameworkIosArm64)
          cd apps/ios
          xcodebuild build -project Tisma.xcodeproj -scheme Tisma -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/release" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/release.log" 2>&1 || { tail -30 "$RUNNER_TEMP/release.log"; exit 1; }
          app=$(find "$RUNNER_TEMP/release/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          (cd "$(dirname "$app")" && mkdir -p Payload && cp -R "$app" Payload/ && zip -qr "$RUNNER_TEMP/Tisma.ipa" Payload)
          {
            echo "### iOS app size"
            echo "IPA (zipped, unsigned): $(( $(stat -f%z "$RUNNER_TEMP/Tisma.ipa") / 1024 )) KB; .app: $(du -sk "$app" | cut -f1) KB"
            echo '```'
            (cd "$app" && du -sk * | sort -rn | head -15)
            echo "executable sections:"
            size -m "$app/Tisma" 2>/dev/null | grep -E "Section|total" | sort -t: -k2 -rn | head -8
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screens/
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-reports
          path: |
            apps/android/shared/build/reports/tests/
            ${{ runner.temp }}/Tisma.xcresult
