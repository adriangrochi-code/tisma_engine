name: iOS

# The iPhone app's shared logic (apps/android/shared, Kotlin Multiplatform; apps/ios/PLAN.md): its common tests run
# on the iPhone simulator, where only a Mac can run them. The SwiftUI app joins here when it exists.
on:
  push:
    paths:
      - "apps/android/shared/**"
      - "apps/android/gradle/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared logic on the iPhone simulator
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tests of the shared module on the simulator (and on the JVM)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 :shared:jvmTest
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-reports
          path: apps/android/shared/build/reports/tests/
