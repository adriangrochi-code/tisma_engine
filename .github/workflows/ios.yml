name: iOS

# The iPhone app's shared logic (apps/android/shared, Kotlin Multiplatform; apps/ios/PLAN.md): its common tests run
# on the iPhone simulator, where only a Mac can run them; then the SwiftUI app (apps/ios) is built and its tests run.
on:
  push:
    paths:
      - "apps/android/shared/**"
      - "apps/android/gradle/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared logic on the iPhone simulator
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tests of the shared module on the simulator (and on the JVM)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 :shared:jvmTest
      - name: Get XcodeGen (THIRD_PARTY.md, build tools)
        working-directory: apps/ios
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the SwiftUI app and run its tests on the simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          echo "Simulator $device"
          set +e
          xcodebuild test -project Tisma.xcodeproj -scheme Tisma -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/Tisma.xcresult" > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          code=$?
          # The compiler's errors first, then the end (the tests).
          grep -E ': error: |Test Case .* failed' "$RUNNER_TEMP/xcodebuild.log" | head -40
          tail -40 "$RUNNER_TEMP/xcodebuild.log"
          exit $code
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-reports
          path: |
            apps/android/shared/build/reports/tests/
            ${{ runner.temp }}/Tisma.xcresult
