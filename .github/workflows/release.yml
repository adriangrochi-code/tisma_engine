name: Release

# Publishes a GitHub release of the version in VERSION (docs/VERSIONING.md):
# builds, tests and packages the engine on Windows and Linux, and publishes the
# release with that version's section of CHANGELOG.md as its notes. A version
# with a pre-release label (such as 0.6.0-alpha.1) is published as a
# pre-release.
#
# It runs when:
# - a push to alpha or main changes VERSION (or this workflow) and the tag
#   v<VERSION> does not exist yet: the release creates the tag on that commit
#   (alpha gets each pre-release from dev, main what the owner closes:
#   docs/VERSIONING.md, "Las ramas");
# - a tag v<VERSION> is pushed: the release goes on the tagged commit.
on:
  push:
    branches:
      - alpha
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is there a version to release?
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag, VERSION and CHANGELOG.md
        id: version
        run: |
          tag="v$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A pushed tag must name the version of its commit.
            python3 tools/release_notes.py "$GITHUB_REF_NAME" > /dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            python3 tools/release_notes.py "$tag" > /dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            programs: build/Release/tisma-engine.exe build/apps/tisma/Release/tisma.exe
          - os: ubuntu-24.04
            name: linux-x64
            programs: build/tisma-engine build/apps/tisma/tisma
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and X11 (for the interface)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          package="tisma-engine-$(cat VERSION)-${{ matrix.name }}"
          mkdir -p "$package/docs"
          cp ${{ matrix.programs }} "$package/"
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY.md VERSION "$package/"
          cp docs/CONFIG.md docs/ANALYSIS.md docs/MATERIALS.md docs/GCODE_CHECK.md docs/VERSIONING.md docs/UI.md "$package/docs/"
          # The design component (cad_design.md, rule 1): SolidCraft's command-line
          # tool at the pinned version, with its licenses (THIRD_PARTY.md).
          sc_version=0.30.0
          mkdir -p "$package/solidcraft" sc
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="solidcraft-$sc_version-windows-x64-portable.zip"
            sha=ae5f502bc0062656965bff31f50739504e24c219baf520526fbd9208dfc261ba
            curl -sSL --retry 3 -o "$asset" "https://github.com/tangency-labs/solidcraft/releases/download/v$sc_version/$asset"
            echo "$sha  $asset" | sha256sum -c -
            (cd sc && cmake -E tar xf "../$asset")
            cp sc/*/solidcraft-cli.exe sc/*/LICENSE-MIT sc/*/LICENSE-APACHE sc/*/NOTICE sc/*/THIRD-PARTY-LICENSES.txt "$package/solidcraft/"
          else
            asset="solidcraft-$sc_version-linux-x86_64.tar.gz"
            sha=5cd95727352b9a343fc8ff4bfb688671a5901a1b601a71c46e94c7b20750c9a0
            curl -sSL --retry 3 -o "$asset" "https://github.com/tangency-labs/solidcraft/releases/download/v$sc_version/$asset"
            echo "$sha  $asset" | sha256sum -c -
            (cd sc && tar xzf "../$asset")
            cp sc/*/bin/solidcraft-cli sc/*/share/doc/solidcraft/LICENSE-MIT sc/*/share/doc/solidcraft/LICENSE-APACHE \
               sc/*/share/doc/solidcraft/NOTICE sc/*/share/doc/solidcraft/THIRD-PARTY-LICENSES.txt "$package/solidcraft/"
          fi
          cmake -E tar cf "$package.zip" --format=zip "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tisma-engine-*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 tools/release_notes.py "$TAG" > notes.md
          version="$(cat VERSION)"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag is used as it is; otherwise the release creates the
          # tag on the commit that was built.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            where="--verify-tag"
          else
            where="--target $GITHUB_SHA"
          fi
          gh release create "$TAG" packages/*.zip --title "Tisma engine $version" --notes-file notes.md $where $prerelease
