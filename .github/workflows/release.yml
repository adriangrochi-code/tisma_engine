name: Release

# Makes a GitHub release of the version in VERSION (docs/VERSIONING.md):
# builds, tests and packages the engine on Windows and Linux, and leaves the
# release as a draft with that version's section of CHANGELOG.md as its notes
# and an unsigned updates.json (tools/updates_list.py). The owner signs it with
# the key on the USB stick and publishes it (tools/sign_release.py,
# docs/FIRMAR_VERSIONES.md; owner's decision, 2026-11-04: the private key is
# never in GitHub). A version with a pre-release label (such as
# 0.6.0-alpha.1) is a pre-release.
#
# The programs check updates with the project's public key, taken at build
# time from the repository variable TISMA_UPDATES_KEY (64 hex digits; not a
# secret). Without it the updater stays off, and the release is published at
# once, with no updates.json and nothing to sign.
#
# It runs when:
# - a push to alpha or main changes VERSION (or this workflow) and the tag
#   v<VERSION> does not exist yet: the release creates the tag on that commit
#   (alpha gets each pre-release from dev, main what the owner closes:
#   docs/VERSIONING.md, "Las ramas");
# - a tag v<VERSION> is pushed: the release goes on the tagged commit.
on:
  push:
    branches:
      - alpha
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is there a version to release?
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag, VERSION and CHANGELOG.md
        id: version
        run: |
          tag="v$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A pushed tag must name the version of its commit.
            python3 tools/release_notes.py "$GITHUB_REF_NAME" > /dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            python3 tools/release_notes.py "$tag" > /dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            programs: build/Release/tisma-engine.exe build/apps/tisma/Release/tisma.exe
          - os: ubuntu-24.04
            name: linux-x64
            programs: build/tisma-engine build/apps/tisma/tisma
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and X11 (for the interface)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - name: Configure
        run: |
          key="-DTISMA_UPDATES_KEY=${{ vars.TISMA_UPDATES_KEY }}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "$key"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "$key"
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          package="tisma-engine-$(cat VERSION)-${{ matrix.name }}"
          mkdir -p "$package/docs"
          cp ${{ matrix.programs }} "$package/"
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY.md VERSION "$package/"
          cp docs/CONFIG.md docs/ANALYSIS.md docs/MATERIALS.md docs/GCODE_CHECK.md docs/VERSIONING.md docs/UI.md "$package/docs/"
          # The design component (cad_design.md, rule 1): SolidCraft's command-line
          # tool at the pinned version, with its licenses (THIRD_PARTY.md).
          sc_version=0.30.0
          mkdir -p "$package/solidcraft" sc
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="solidcraft-$sc_version-windows-x64-portable.zip"
            sha=ae5f502bc0062656965bff31f50739504e24c219baf520526fbd9208dfc261ba
            curl -sSL --retry 3 -o "$asset" "https://github.com/tangency-labs/solidcraft/releases/download/v$sc_version/$asset"
            echo "$sha  $asset" | sha256sum -c -
            (cd sc && cmake -E tar xf "../$asset")
            cp sc/*/solidcraft-cli.exe sc/*/LICENSE-MIT sc/*/LICENSE-APACHE sc/*/NOTICE sc/*/THIRD-PARTY-LICENSES.txt "$package/solidcraft/"
          else
            asset="solidcraft-$sc_version-linux-x86_64.tar.gz"
            sha=5cd95727352b9a343fc8ff4bfb688671a5901a1b601a71c46e94c7b20750c9a0
            curl -sSL --retry 3 -o "$asset" "https://github.com/tangency-labs/solidcraft/releases/download/v$sc_version/$asset"
            echo "$sha  $asset" | sha256sum -c -
            (cd sc && tar xzf "../$asset")
            cp sc/*/bin/solidcraft-cli sc/*/share/doc/solidcraft/LICENSE-MIT sc/*/share/doc/solidcraft/LICENSE-APACHE \
               sc/*/share/doc/solidcraft/NOTICE sc/*/share/doc/solidcraft/THIRD-PARTY-LICENSES.txt "$package/solidcraft/"
          fi
          cmake -E tar cf "$package.zip" --format=zip "$package"
          # Windows: the installer too (packaging/windows/tisma.nsi; NSIS,
          # zlib/libpng licence), per user, with its shortcuts and file types.
          if [ "$RUNNER_OS" = "Windows" ]; then
            nsis="$(command -v makensis || true)"
            if [ -z "$nsis" ]; then
              [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
              nsis="/c/Program Files (x86)/NSIS/makensis.exe"
            fi
            "$nsis" -V2 -DVERSION="$(cat VERSION)" -DSOURCE="$(cygpath -w "$PWD/$package")" \
              -DOUTFILE="$(cygpath -w "$PWD/tisma-engine-$(cat VERSION)-setup-windows-x64.exe")" \
              -DICON="$(cygpath -w "$PWD/assets/brand/app/tisma.ico")" packaging/windows/tisma.nsi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tisma-engine-*.zip
            tisma-engine-*.exe
          if-no-files-found: error

  # The Android app (apps/android/, as .github/workflows/android.yml builds it): the testers' build shrunk by R8
  # and the debug one as a fallback, both for phones (arm64-v8a), with SolidCraft when its workflow has artifacts.
  android:
    name: Build (android-arm64)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the NDK the engine is built with
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
      - name: Get SolidCraft from its own workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow solidcraft-android.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)
          dir="$RUNNER_TEMP/solidcraft"
          if [ -n "$run" ]; then
            for abi in arm64-v8a x86_64; do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "solidcraft-android-$abi" -D "$RUNNER_TEMP/sc-$abi" || true
              mkdir -p "$dir" && cp -rn "$RUNNER_TEMP/sc-$abi"/. "$dir"/ 2>/dev/null || true
            done
          fi
          if [ -f "$dir/arm64-v8a/solidcraft-cli" ] && [ -f "$dir/x86_64/solidcraft-cli" ]; then
            chmod +x "$dir"/*/solidcraft-cli
            echo "SOLIDCRAFT=-Ptisma.solidcraft=$dir" >> "$GITHUB_ENV"
          else
            echo "::notice::No SolidCraft artifacts: the APKs are built without the Design tab's CAD"
          fi
      - name: Build
        run: ./gradlew --no-daemon $SOLIDCRAFT :app:assembleDebug :app:assembleBeta
      - name: Name the APKs after the release
        run: |
          version="$(cat ../../VERSION)"
          cp app/build/outputs/apk/beta/app-arm64-v8a-beta.apk "../../tisma-android-$version-beta-arm64.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "../../tisma-android-$version-fallback-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: tisma-android-*.apk
          if-no-files-found: error

  publish:
    name: Leave the release as a draft for the owner to sign (published as it is without the key)
    needs: [version, build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 tools/release_notes.py "$TAG" > notes.md
          version="$(cat VERSION)"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag is used as it is; otherwise the release creates the
          # tag on the commit that was built.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            where="--verify-tag"
          else
            where="--target $GITHUB_SHA"
          fi
          # Without the project's public key the programs are built with the
          # updater off: nothing to sign, so the release is published as it
          # is, without updates.json (docs/FIRMAR_VERSIONES.md, «Sin la clave»).
          if [ -z "${{ vars.TISMA_UPDATES_KEY }}" ]; then
            gh release create "$TAG" packages/* --title "Tisma engine $version" \
              --notes-file notes.md $where $prerelease
            echo "::notice::$TAG published without updates.json: no TISMA_UPDATES_KEY, the updater is off in this build"
            exit 0
          fi
          # The list the programs read, with this release first and its
          # signatures empty: the published list, if any, is the base.
          gh release download updates --pattern updates.json --dir previous 2>/dev/null || true
          python3 tools/updates_list.py --version "$version" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes notes.md --previous previous/updates.json -o updates.json packages/*
          gh release create "$TAG" packages/* updates.json --draft --title "Tisma engine $version" \
            --notes-file notes.md $where $prerelease
          echo "::notice::$TAG is a draft: sign it and publish it with tools/sign_release.py (docs/FIRMAR_VERSIONES.md)"
