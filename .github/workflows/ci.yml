name: CI

# Windows builds and tests every push. Linux runs inside the work session
# before every push (tools/ci_linux.sh, the same steps as the Linux jobs
# here), so on GitHub the Linux jobs only run when started by hand (owner's
# decision, 2026-10-24). macOS builds and tests every push too, on Apple
# silicon and on Intel (owner's decision, 2026-11-10: before the closed beta;
# PLAN.md, «macOS antes de la beta»). While it is being brought up it does
# not fail the run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run of the same branch; a run started by hand
# never cancels a push run, nor the other way round.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TISMA_REQUIRE_GPU: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja, lavapipe, glslang and X11 (for the interface)
        # lavapipe is Mesa's software Vulkan device: the GPU tests run without a GPU.
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers glslang-tools libssl-dev
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - name: Check the generated SPIR-V
        run: python3 tools/compile_shaders.py --check
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    name: Linux (gcc, ASan + UBSan)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TISMA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja, lavapipe and X11 (for the interface)
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers libssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # macOS before the beta (PLAN.md): green on both since 2026-11-10, so it counts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15 # arm64; macos-14 jobs were cancelled before they started
          - arch: x86_64
            runner: macos-15-intel # macos-13 is retired: a job asking for it waits forever
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and OpenSSL 3
        run: brew install ninja openssl@3
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Tisma.app as the release makes it
        run: |
          mkdir -p pkg && cp build/tisma-engine build/apps/tisma/tisma LICENSE pkg/
          packaging/macos/make_app.sh pkg 0.0.0
          plutil -lint pkg/Tisma.app/Contents/Info.plist
          test -x pkg/Tisma.app/Contents/MacOS/tisma && test -s pkg/Tisma.app/Contents/Resources/tisma.icns
          pkg/Tisma.app/Contents/MacOS/tisma-engine --version

  ios:
    name: iOS library (xcframework)
    runs-on: macos-15
    # Being brought up (PLAN.md, «macOS antes de la beta»): it does not fail the run yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Build TismaEngine.xcframework
        run: tools/build_ios.sh build-ios
      - name: The C entry is in both slices
        run: |
          for a in build-ios/iphoneos/libtisma_engine.a build-ios/iphonesimulator/libtisma_engine.a; do
            nm -gU "$a" 2>/dev/null | grep -q '_tisma_run_cli$'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-engine-ios-xcframework
          path: build-ios/TismaEngine.xcframework
          if-no-files-found: error
