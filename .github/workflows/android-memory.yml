name: Android memory

# Small phones and large models (mobile_app.md, rules 12 and 19; QA, 13-11-2026): the debug APK on emulators with
# 2 and 3 GB of RAM slices a model the size of a Benchy (about 225 000 triangles) and a large one (2 million), both
# generated spheres (bench/gen_sphere.py; the Benchy itself is not in the repository, bench/README.md). It records
# the engine's peak memory and time and checks that the app's estimate warns before memory runs out
# (apps/android/tools/memory_check.sh). Started by hand or when this check changes.
on:
  push:
    paths:
      - ".github/workflows/android-memory.yml"
      - "apps/android/tools/memory_check.sh"
      - "apps/android/app/src/main/generated/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    name: Emulator with ${{ matrix.ram }} MB
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ram: [2048, 3072]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the NDK, the emulator and its system image
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" emulator platform-tools \
            "system-images;android-34;google_apis;x86_64" > /dev/null
      - name: Build the debug APK (engine inside)
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleBeta
      - name: The models
        run: |
          # 3DBenchy (CC0 1.0, bench/README.md of dev): the engine's bench model, taken from dev.
          git fetch -q --depth 1 origin dev
          git show FETCH_HEAD:bench/3DBenchy.stl.xz | xz -d > "$RUNNER_TEMP/3DBenchy.stl"
          python3 bench/gen_sphere.py "$RUNNER_TEMP/benchy_size.stl" --segments 335
          python3 bench/gen_sphere.py "$RUNNER_TEMP/big.stl" --segments 1000
          # 5 million triangles: past what the app's estimate lets a 2 or 3 GB phone slice, to see the warning.
          python3 bench/gen_sphere.py "$RUNNER_TEMP/huge.stl" --segments 1600
      - name: Start the emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n small -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_5 -p "$ANDROID_AVD_HOME/small.avd"
          printf 'hw.ramSize=%s\n' "${{ matrix.ram }}" >> "$ANDROID_AVD_HOME/small.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd small -no-window -no-audio -no-boot-anim -no-snapshot \
            -memory ${{ matrix.ram }} -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb wait-for-device
          timeout 600 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb install -r apps/android/app/build/outputs/apk/debug/app-x86_64-debug.apk
      - name: Slice and measure
        run: |
          set -o pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          apps/android/tools/memory_check.sh tests/data/printer_settings.json \
            "$RUNNER_TEMP/3DBenchy.stl" "$RUNNER_TEMP/benchy_size.stl" "$RUNNER_TEMP/big.stl" "$RUNNER_TEMP/huge.stl" | tee -a "$GITHUB_STEP_SUMMARY"
      # Cold start (QA, 13-11-2026: the time until the Plate shows, to be under 2 s): the app stopped and started
      # again five times after a first start, on the testers' build (R8 and its startup profile, as installed from
      # the store); `am start -W` gives the time to the first drawn frame.
      - name: Cold start
        if: ${{ !cancelled() }}
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pkg=net.tismaservidores.tisma
          adb install -r apps/android/app/build/outputs/apk/beta/app-x86_64-beta.apk
          act=$(adb shell cmd package resolve-activity --brief $pkg | tail -1 | tr -d '\r')
          adb shell am start -W -n "$act" > /dev/null; sleep 5
          # Compiled with its startup profile, as the store's install does (cloud profiles) and the app's own
          # profile installer does after a while.
          adb shell cmd package compile -m speed-profile -f $pkg
          for i in 1 2 3 4 5; do
            adb shell am force-stop $pkg; sleep 2
            adb shell am start -W -n "$act" | tr -d '\r' | sed -n 's/^TotalTime: //p'
          done | tee "$RUNNER_TEMP/cold.txt"
          echo "Cold start on ${{ matrix.ram }} MB (ms, five runs): $(tr '\n' ' ' < "$RUNNER_TEMP/cold.txt")" | tee -a "$GITHUB_STEP_SUMMARY"
