# The iPhone app (apps/ios/PLAN.md, step 5). XcodeGen makes Tisma.xcodeproj from this file (THIRD_PARTY.md,
# build tools); the project itself is not kept in the repository.
name: Tisma
options:
  bundleIdPrefix: net.tismaservidores
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tisma:
    type: application
    platform: iOS
    sources:
      - Tisma
      # The engine's catalog of printers and filaments (docs/CATALOG.md), the same files as desktop and Android.
      - path: ../../resources/catalog/printers.json
        buildPhase: resources
      - path: ../../resources/catalog/filaments.json
        buildPhase: resources
      # The settings panel's layout (settings_panel.md), the same files as Android's.
      - path: ../android/app/src/main/assets/settings/layout_en.json
        buildPhase: resources
      - path: ../android/app/src/main/assets/settings/layout_es.json
        buildPhase: resources
      # The credits and license notices (credits.md): the engine's, and the iPhone's own list.
      - path: ../../resources/credits.json
        buildPhase: resources
      - path: credits_ios.json
        buildPhase: resources
      - path: ../../resources/licenses
        type: folder
        buildPhase: resources
    dependencies:
      # The engine as a static library (the engine's CI, apps/ios/PLAN.md step 4); C++ inside, so libc++ too.
      - framework: Engine/TismaEngine.xcframework
        embed: false
      - sdk: libc++.tbd
    # «Compartir con Tisma» (mobile_app.md, rule 10): other apps can open STL, OBJ and 3MF files in Tisma.
    info:
      path: Tisma/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        # The print notices read the printer now and then in the background (PrintWatcher).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [net.tismaservidores.tisma.watch]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D model
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.standard-tesselated-geometry-format
              - public.geometry-definition-format
              - public.3mf
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.tismaservidores.tisma
        SWIFT_OBJC_BRIDGING_HEADER: Tisma/Tisma-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tisma
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Tisma finds and controls the 3D printers on your network."
        # The shared Kotlin module, built by Gradle before Xcode (`:shared:linkDebugFrameworkIosSimulatorArm64`).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/shared/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: -framework TismaShared
        # Signed to run locally (no team): the simulator's Keychain needs a signed app.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  TismaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TismaTests]
    dependencies:
      - target: Tisma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/shared/build/bin/iosSimulatorArm64/debugFramework
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  TismaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TismaUITests]
    dependencies:
      - target: Tisma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tisma
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Tisma:
    build:
      targets:
        Tisma: all
        TismaTests: [test]
        TismaUITests: [test]
    test:
      targets: [TismaTests, TismaUITests]
