# The iPhone app (apps/ios/PLAN.md, step 5). XcodeGen makes Tisma.xcodeproj from this file (THIRD_PARTY.md,
# build tools); the project itself is not kept in the repository.
name: Tisma
options:
  bundleIdPrefix: net.tismaservidores
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tisma:
    type: application
    platform: iOS
    sources: [Tisma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.tismaservidores.tisma
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tisma
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Tisma finds and controls the 3D printers on your network."
        # The shared Kotlin module, built by Gradle before Xcode (`:shared:linkDebugFrameworkIosSimulatorArm64`).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/shared/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: -framework TismaShared
        CODE_SIGNING_ALLOWED: NO
  TismaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TismaTests]
    dependencies:
      - target: Tisma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/shared/build/bin/iosSimulatorArm64/debugFramework
        CODE_SIGNING_ALLOWED: NO
schemes:
  Tisma:
    build:
      targets:
        Tisma: all
        TismaTests: [test]
    test:
      targets: [TismaTests]
