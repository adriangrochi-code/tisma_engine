# Keeps the GitHub Actions of the workflows up to date (weekly pull requests, Conventional Commits titles).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
